<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurant Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="app">


    <div class="header">

        <div class="logo">
            🍽️
        </div>

        <div>

            <h1>Restaurant Assistant</h1>

            <p>
                Your personal food recommendation assistant
            </p>

        </div>

    </div>


    <div
        id="chatBox"
        class="chat-box"
    >

        <div class="message bot">

            <div class="avatar">
                🤖
            </div>

            <div class="bubble">

                Hello! 👋

                <br><br>

                Welcome to our Restaurant Assistant! 🍽️

                <br><br>

                Tell me what kind of food you would like.

            </div>

        </div>

    </div>


    <div class="quick-buttons">

        <button
            onclick="sendQuick('Hi')"
        >
            👋 Hi
        </button>


        <button
            onclick="sendQuick('I want vegetarian food')"
        >
            🥗 Vegetarian
        </button>


        <button
            onclick="sendQuick('I want non vegetarian food')"
        >
            🍗 Non-Veg
        </button>


        <button
            onclick="sendQuick('I want spicy South Indian food')"
        >
            🌶️ South Indian
        </button>

    </div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Ask about food..."
        >


        <button
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


</div>


<script>


function sendQuick(message) {

    document.getElementById(
        "messageInput"
    ).value = message;


    sendMessage();

}



function addMessage(
    message,
    sender
) {

    const chatBox =
        document.getElementById(
            "chatBox"
        );


    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message " + sender;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    avatar.innerHTML =
        sender === "bot"
        ? "🤖"
        : "👤";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.innerHTML =
        message;


    messageDiv.appendChild(
        avatar
    );


    messageDiv.appendChild(
        bubble
    );


    chatBox.appendChild(
        messageDiv
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;

}



async function sendMessage() {


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "application/json"

                    },

                    body: JSON.stringify({

                        message: message

                    })

                }
            );


        const data =
            await response.json();


        addMessage(
            data.message,
            "bot"
        );


    }

    catch (error) {


        console.error(error);


        addMessage(

            "Sorry 😕 Something went wrong. Please try again.",

            "bot"

        );

    }

}



document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
